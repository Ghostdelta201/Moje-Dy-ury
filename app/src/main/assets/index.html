<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F3D36"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>Grafik pracy</title>
<style>
:root{--ink:#1B2A2F;--mut:#4A5A5F;--g:#0F6B5C;--bg:#F4F6F3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 0;display:flex;flex-direction:column;gap:12px}
button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between}.top b{font-size:20px}
.nb{width:44px;height:44px;border:0;border-radius:22px;background:#fff;font-size:18px;color:var(--ink)}
.card{background:#0F3D36;color:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card small{color:#BFE0D8;font-size:12px}.big{font-size:32px;font-weight:700;line-height:1.1}.big span{font-size:15px;font-weight:500;color:#BFE0D8}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:12px}
.ok{background:#BFF0D4;color:#0B3B22}.warn{background:#FFD98A;color:#4A3000}.low{background:#CFE0FF;color:#12326F}
.bar{height:8px;border-radius:4px;background:#2A5C54;overflow:hidden;display:flex}
.row2{display:flex;justify-content:space-between;gap:8px}
.w{background:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:52px;font-size:13px}
.w .n{font-size:28px;font-weight:700;color:var(--g);min-width:36px;text-align:center}
.w small{display:block;font-size:12px;color:var(--mut)}
.bn{display:block;background:#FFF1D6;color:#5E3A00;font-weight:700;text-decoration:none;border-radius:14px;padding:12px;font-size:14px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.h{font-size:11px;font-weight:600;color:var(--mut);text-align:center;padding:4px 0}
.d{position:relative;height:52px;border:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;font-size:15px;font-weight:600;color:var(--ink)}
.d i{font-style:normal;font-size:10px;font-weight:600;min-height:13px;color:var(--g)}
.d u{position:absolute;top:3px;right:3px;line-height:0;color:#1F4BB8}
.we{background:#E6E9E7;color:#4A5A5F}.su{background:#FBEAE8;color:#A3201A}.ho{background:#A3201A;color:#fff}.tr{background:#E4ECFB;color:#1F4BB8}
.ho i{color:#fff}.p{opacity:.8}.now{outline:2px solid var(--ink);outline-offset:1px}
.d12{background:#FFE3A3;color:#5E3A00}.n12{background:#2B2F6B;color:#fff}.h8{background:#CDEFDC;color:#0B4A2A}.h4{background:#E6D9FA;color:#43257F}
.d12 i,.n12 i,.h8 i,.h4 i{color:inherit}.d12 u,.n12 u,.h8 u,.h4 u{color:inherit}
.d i::before{content:"";display:inline-block;margin-right:3px;vertical-align:-1px}
.d12 i::before{width:9px;height:9px;border-radius:50%;background:#E8890C}
.n12 i::before{width:9px;height:9px;border-radius:50%;box-shadow:inset -3px 0 0 #FFD98A}
.h8 i::before{width:10px;height:5px;border-radius:10px 10px 0 0;background:#1E9E5A;vertical-align:0}
.h4 i::before{width:8px;height:8px;border-radius:2px;background:#7A4FD0;transform:rotate(45deg)}
.lg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:11px}.lg span{display:flex;align-items:center;gap:5px}.lg s{width:12px;height:12px;border-radius:4px;display:block}
.c{background:#fff;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.c h3{margin:0;font-size:14px}.r{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.br{height:10px;border-radius:5px;background:#E6E9E7;overflow:hidden;display:flex}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-bottom:1px solid #E6E9E7;font-size:14px}.set:last-child{border:0}
.set input,.set select{font:inherit;padding:8px;border:1px solid #C5CDC9;border-radius:10px;background:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #D5DBD7;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px}
nav button.on{color:var(--g)}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}.sh{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tg button{height:64px;border:3px solid transparent;border-radius:14px;text-align:left;padding:0 12px;font-weight:700}.tg button small{display:block;font-weight:500;font-size:12px}
.tg button.sel{border-color:var(--ink)}
.q{border:1px solid #C5CDC9;background:#fff;border-radius:22px;min-height:44px;padding:0 14px;font-weight:600}.q.sel{background:var(--g);color:#fff;border-color:var(--g)}
.pri{height:52px;border:0;border-radius:26px;background:var(--g);color:#fff;font-weight:700;font-size:16px}
.tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;max-width:90%}
</style></head><body><div id="app"></div><div id="sheet"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
const add=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const MN=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const TY={d12:['12 h dzień',12,'7:30–19:30'],n12:['12 h noc',12,'19:30–7:30'],h8:['8 h',8,'7:30–15:30'],h4:['4 h',4,'7:30–11:30']};
const CART='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="niedziela handlowa"><path d="M2 4h3l2.5 11h10L20 7H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>';
const K='grafik-pracy-v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{shifts:{},rem:{},alarm:{},set:{auto:true,alarm:'06:00',open:'05:00',close:'23:00',period:0,daily:8}};
const sv=()=>localStorage.setItem(K,JSON.stringify(S));
let V=new Date();V.setDate(1);let tab='cal';const today=iso(new Date());
// --- kalendarz: święta, niedziele handlowe, norma ---
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),x=h+l-7*m+114;return new Date(y,Math.floor(x/31)-1,x%31+1)}
const HC={},TC={};
function hol(y){if(HC[y])return HC[y];const s=new Set(['01-01','01-06','05-01','05-03','08-15','11-01','11-11','12-25','12-26'].map(x=>y+'-'+x));if(y>=2025)s.add(y+'-12-24');const e=easter(y);[0,1,49,60].forEach(n=>s.add(iso(add(e,n))));return HC[y]=s}
function trade(y){if(TC[y])return TC[y];const s=new Set();[0,3,5,7].forEach(m=>{const d=new Date(y,m+1,0);s.add(iso(add(d,-d.getDay())))});s.add(iso(add(easter(y),-7)));const c=new Date(y,11,24),l=add(c,-(c.getDay()||7));s.add(iso(l));if(y>=2025){s.add(iso(add(l,-7)));s.add(iso(add(l,-14)))}return TC[y]=s}
function info(y,m){const D=+S.set.daily,n=new Date(y,m+1,0).getDate();let norm=0,wd=0,hw=0,hs=0,plan=0,work=0,free=0,past=0,sd=0;
for(let d=1;d<=n;d++){const dt=new Date(y,m,d),w=dt.getDay(),k=iso(dt),H=hol(y).has(k);
if(H){if(w==6)hs++;else if(w>0)hw++}if(w>=1&&w<=5)wd++;
const sh=S.shifts[k];if(sh){sd++;plan+=TY[sh][1];if(k<=today)work+=TY[sh][1]}else{free++;if(k<=today)past++}}
norm=(wd-hw-hs)*D;return{norm,wd,hw,hs,plan,work,free,past,sd,n}}
const period=(y,m)=>{const b=((m-S.set.period)%3+3)%3;return[0,1,2].map(i=>{const d=new Date(y,m-b+i,1);return[d.getFullYear(),d.getMonth()]})};
const AU=(t,msg)=>{const[h,m]=t.split(':');return`intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${+h};i.android.intent.extra.alarm.MINUTES=${+m};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(msg)};end`};
const toast=t=>{const e=document.createElement('div');e.className='tt';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)};
const AN=window.Android;
function sync(k){if(!AN)return;AN.cancel('a'+k);AN.cancel('r'+k);const sh=S.shifts[k];if(!sh)return;const a=S.alarm[k];
if(a)AN.schedule('a'+k,String(new Date(k+'T'+a).getTime()),'Dyżur '+TY[sh][0],'Czas wstawać · '+TY[sh][2]);
const r=S.rem[k];if(r){const tm=r=='open'?S.set.open:S.set.close;AN.schedule('r'+k,String(new Date(k+'T'+tm).getTime()),r=='open'?'Otwórz bramę':'Zamknij bramę','Dyżur '+TY[sh][0])}}
function syncAll(){if(!AN)return;Object.keys(S.shifts).filter(k=>k>=today).forEach(sync)}
function banners(){if(AN)return'';let o='';const now=new Date(),hm=p(now.getHours())+':'+p(now.getMinutes());
[0,1].forEach(i=>{const dt=add(new Date(),i),k=iso(dt),sh=S.shifts[k],L=i?'Jutro':'Dziś';if(!sh)return;
const a=S.alarm[k];if(a&&(i||a>hm))o+=`<a class="bn" href="${AU(a,'Dyżur '+TY[sh][0])}">${L}: ${TY[sh][0]} · ustaw alarm ${a}</a>`;
const r=S.rem[k];if(r){const t=r=='open'?S.set.open:S.set.close;if(i||t>hm)o+=`<a class="bn" href="${AU(t,r=='open'?'Otwórz bramę':'Zamknij bramę')}">${L}: ${r=='open'?'otwarcie':'zamknięcie'} bramy · ustaw przypomnienie ${t}</a>`}});return o}
function cal(){const y=V.getFullYear(),m=V.getMonth(),I=info(y,m),dv=I.plan-I.norm,rem=I.norm-I.work,off=(new Date(y,m,1).getDay()+6)%7;
const chip=dv>0?`<span class="chip warn">+${dv} h ponad normę</span>`:dv==0?'<span class="chip ok">Grafik = norma</span>':`<span class="chip low">Brakuje ${-dv} h w grafiku</span>`;
let g='<div></div>'.repeat(off);
for(let d=1;d<=I.n;d++){const dt=new Date(y,m,d),k=iso(dt),w=dt.getDay(),sh=S.shifts[k],H=hol(y).has(k),T=trade(y).has(k);let c='d';
if(sh)c+=' '+sh;else if(H)c+=' ho';else if(T)c+=' tr';else if(w==0)c+=' su';else if(w==6)c+=' we';
if(sh&&k>today)c+=' p';if(k==today)c+=' now';
g+=`<button class="${c}" data-k="${k}" aria-label="${d} ${MN[m]}">${d}<i>${sh?TY[sh][1]+'h':H?'święto':''}</i>${T?'<u>'+CART+'</u>':''}</button>`}
return`<div class="top"><button class="nb" id="pv" aria-label="Poprzedni miesiąc">‹</button><b>${MN[m]} ${y}</b><button class="nb" id="nx" aria-label="Następny miesiąc">›</button></div>
<div class="card"><div class="row2"><div><small>Zostało do normy</small><div class="big">${Math.max(rem,0)} h <span>z ${I.norm} h</span></div></div><div>${chip}</div></div>
<div class="bar"><div style="width:${Math.min(100,I.work/I.norm*100||0)}%;background:#6FD1BC"></div><div style="width:${Math.max(0,Math.min(100-I.work/I.norm*100,(I.plan-I.work)/I.norm*100))||0}%;background:#9FB9B3"></div></div>
<div class="row2"><small>Przepracowano ${I.work} h</small><small>W grafiku jeszcze ${I.plan-I.work} h</small></div></div>
${banners()}
<div class="w"><div class="n">${I.free}</div><div style="flex:1"><b>Dni wolne w miesiącu</b><small>${I.sd} dni z dyżurem</small></div><div style="text-align:right;font-size:12px">minęło ${I.past}<br><b style="font-size:13px">zostało ${I.free-I.past}</b></div></div>
<div><div class="g">${'Pn,Wt,Śr,Cz,Pt,Sb,Nd'.split(',').map(x=>`<div class="h">${x}</div>`).join('')}</div><div class="g">${g}</div></div>
<div class="lg"><span><s style="background:#FFE3A3;box-shadow:inset 0 0 0 4px #E8890C"></s>12 h dzień</span><span><s style="background:#2B2F6B;box-shadow:inset -4px 0 #FFD98A"></s>12 h noc</span><span><s style="background:#CDEFDC;box-shadow:inset 0 -5px #1E9E5A"></s>8 h</span><span><s style="background:#E6D9FA;box-shadow:inset 0 0 0 4px #7A4FD0"></s>4 h</span><span><s style="background:#E6E9E7"></s>Sobota</span><span><s style="background:#FBEAE8"></s>Niedziela</span><span><s style="background:#A3201A"></s>Święto</span><span><s style="background:#E4ECFB"></s>Niedz. handlowa (koszyk)</span></div>`}
function qtr(){const y=V.getFullYear(),m=V.getMonth(),P=period(y,m),L=P.map(([a,b])=>({a,b,...info(a,b)})),N=L.reduce((s,x)=>s+x.norm,0),PL=L.reduce((s,x)=>s+x.plan,0),W=L.reduce((s,x)=>s+x.work,0),ot=Math.max(0,PL-N),I=info(y,m);
const rows=L.map(x=>{const dl=x.plan-x.norm;return`<div class="r"><span>${MN[x.b]} ${x.a}</span><b>${x.plan} / ${x.norm} h · ${dl>0?'+':dl<0?'−':''}${Math.abs(dl)}</b></div><div class="br"><div style="width:${Math.min(100,x.plan/x.norm*100)}%;background:var(--g)"></div>${x.plan>x.norm?`<div style="width:${(x.plan-x.norm)/x.norm*100}%;background:#FFD98A"></div>`:''}</div>`}).join('');
return`<div class="top"><button class="nb" id="pv" aria-label="Poprzedni">‹</button><b>Okres rozliczeniowy</b><button class="nb" id="nx" aria-label="Następny">›</button></div>
<div class="card"><small>Nadgodziny w okresie (${MN[P[0][1]]}–${MN[P[2][1]]})</small><div class="big">${ot} h</div><span class="chip ${ot?'warn':'ok'}" style="align-self:flex-start">${ot?'Grafik przekracza normę okresu':'Bilans w normie okresu'}</span><small>Przepracowano ${W} h · w grafiku ${PL} h · norma ${N} h</small></div>
<div class="c"><h3>Nadwyżka i niedobór po miesiącach</h3>${rows}<small style="color:var(--mut)">Nadwyżka w jednym miesiącu jest pokrywana niedoborem w innym. Nadgodziny powstają dopiero po przekroczeniu normy całego okresu (do potwierdzenia u pracodawcy).</small></div>
<div class="c"><h3>Norma: ${MN[m]}</h3><div class="r"><span>Dni robocze (Pn–Pt)</span><b>${I.wd}</b></div><div class="r"><span>Święta w dni robocze</span><b>−${I.hw}</b></div><div class="r"><span>Święta w sobotę (dzień wolny)</span><b>−${I.hs}</b></div><div class="r" style="border-top:1px solid #E6E9E7;padding-top:8px"><span>${I.wd-I.hw-I.hs} dni × ${S.set.daily} h</span><b>${I.norm} h</b></div></div>`}
function sett(){const s=S.set;return`<div class="top"><b>Ustawienia</b></div><div class="c"><h3>Alarm i brama</h3>
<label class="set">Alarm przy dyżurze<input type="checkbox" data-s="auto" ${s.auto?'checked':''}></label>
<label class="set">Domyślna godzina alarmu<input type="time" data-s="alarm" value="${s.alarm}"></label>
<label class="set">Otwarcie bramy<input type="time" data-s="open" value="${s.open}"></label>
<label class="set">Zamknięcie bramy<input type="time" data-s="close" value="${s.close}"></label></div>
<div class="c"><h3>Norma czasu pracy</h3>
<label class="set">Norma dobowa (h)<input type="number" min="1" max="12" data-s="daily" value="${s.daily}" style="width:80px"></label>
<label class="set">Kwartały zaczynają się od<select data-s="period"><option value="0" ${s.period==0?'selected':''}>stycznia</option><option value="1" ${s.period==1?'selected':''}>lutego</option><option value="2" ${s.period==2?'selected':''}>marca</option></select></label></div>
<div class="c"><h3>Dyżury</h3>${Object.values(TY).map(t=>`<div class="r"><span>${t[0]}</span><b>${t[2]}</b></div>`).join('')}</div>
<button class="q" id="rs" style="color:#A3201A">Usuń wszystkie dane</button>`}
function nav(){$('#nav').innerHTML=[['cal','Kalendarz','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'],['q','Nadgodziny','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],['set','Ustawienia','<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>']].map(([k,t,i])=>`<button data-t="${k}" class="${tab==k?'on':''}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${i}</svg>${t}</button>`).join('')}
function render(){$('#app').innerHTML=tab=='cal'?cal():tab=='q'?qtr():sett();nav()}
// --- arkusz dnia ---
let sel={};
function sheet(k){const sh=S.shifts[k]||'',has=!!S.shifts[k];sel={k,t:sh,r:S.rem[k]||'',a:has?!!S.alarm[k]:S.set.auto,at:S.alarm[k]||S.set.alarm};drawSheet();$('#sheet').classList.add('on')}
function drawSheet(){const dt=new Date(sel.k+'T12:00'),T=trade(dt.getFullYear()).has(sel.k),H=hol(dt.getFullYear()).has(sel.k),col={d12:'#FFE3A3',n12:'#2B2F6B;color:#fff',h8:'#CDEFDC',h4:'#E6D9FA'};
$('#sheet').innerHTML=`<div class="sh"><b style="font-size:18px">${dt.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})}</b><small>${H?'Święto · ':''}${T?'Niedziela handlowa':''}</small>
<div class="tg">${Object.entries(TY).map(([k,t])=>`<button data-ty="${k}" class="${sel.t==k?'sel':''}" style="background:${col[k]}">${t[0]}<small>${t[2]}</small></button>`).join('')}</div>
<div><b style="font-size:14px">Przypomnienie o bramie</b><div class="row2" style="justify-content:flex-start;margin-top:6px"><button class="q ${sel.r=='open'?'sel':''}" data-r="open">Otwarcie ${S.set.open}</button><button class="q ${sel.r=='close'?'sel':''}" data-r="close">Zamknięcie ${S.set.close}</button><button class="q ${!sel.r?'sel':''}" data-r="">Brak</button></div></div>
<div class="set"><label>Alarm <input type="checkbox" id="ca" ${sel.a?'checked':''}></label><input type="time" id="at" value="${sel.at}"></div>
<button class="pri" id="sv">Zapisz</button><button class="q" id="dl" style="color:#A3201A">Usuń dyżur</button><button class="q" id="cl">Zamknij</button></div>`}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.k)return sheet(t.dataset.k);
if(t.dataset.t){tab=t.dataset.t;return render()}
if(t.id=='pv'||t.id=='nx'){V.setMonth(V.getMonth()+(t.id=='pv'?-1:1)*(tab=='q'?3:1));return render()}
if(t.dataset.ty){sel.t=t.dataset.ty;sel.at=document.getElementById('at').value;sel.a=document.getElementById('ca').checked;return drawSheet()}
if(t.dataset.r!==undefined){sel.r=t.dataset.r;sel.at=document.getElementById('at').value;sel.a=document.getElementById('ca').checked;return drawSheet()}
if(t.id=='cl')return $('#sheet').classList.remove('on');
if(t.id=='dl'){delete S.shifts[sel.k];delete S.rem[sel.k];delete S.alarm[sel.k];sv();sync(sel.k);$('#sheet').classList.remove('on');return render()}
if(t.id=='sv'){if(!sel.t)return toast('Wybierz rodzaj dyżuru');const a=document.getElementById('ca').checked,at=document.getElementById('at').value;
